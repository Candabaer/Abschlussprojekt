<input type="file" class="file-input" (change)="onFileSelected($event)" #fileUpload>

<div [formGroup]="form" class="course-details-form">
  <div class="file-upload">
    <mat-form-field>
      <input matInput formControlName="image" [disabled]="true" [value]="fileName">
      @if(form.get('image')?.errors?.['required']){
        <mat-error>Bild ist erforderlich</mat-error>
      }
    </mat-form-field>
    <button mat-mini-fab (click)="fileUpload.click()">
      <mat-icon>attach_file</mat-icon>
    </button>
  </div>
  @if(imagePreview){
    <div class="image-preview">
      <img [src]="imagePreview" alt="Preview" />
    </div>
  }
</div>
